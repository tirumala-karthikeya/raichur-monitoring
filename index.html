<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Raichur District School Monitoring</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f7fbfd; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!--
    School link page. Opening the Apps Script link directly on a phone signed into
    several Google accounts sends it to ".../macros/u/1/s/..." and shows
    "Sorry, unable to open the file at present". This page loads the app in a
    credentialless frame (no Google cookies), so no account is picked and the
    app always opens as an anonymous visitor. Host it on any HTTPS static host.
  -->
  <iframe id="app" title="School Monitoring" credentialless allow="clipboard-write"></iframe>
  <script>
    // Keep in step with WEB_APP_URL in the Config sheet.
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwT1ys-RzArhVlcPKpXWPzbKdr742sKldwUwQazQzUxo-dMdaBVrfJYzpVdfp3ECAy6/exec';
    const APP_FRAME_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
    const frame = document.getElementById('app');

    function queryOf(url) {
      const text = String(url || '');
      const i = text.indexOf('?');
      return i < 0 ? '' : text.slice(i);
    }

    function load(search) {
      frame.src = APP_URL + (search || '');
    }

    window.addEventListener('message', event => {
      if (!APP_FRAME_ORIGIN.test(event.origin) || !event.data || typeof event.data !== 'object') return;
      if (event.data.type === 'monitoring-hello') {
        event.source.postMessage({ type: 'monitoring-wrapped' }, event.origin);
      } else if (event.data.type === 'monitoring-navigate') {
        // Only the query is taken from the app; the target is always APP_URL.
        const search = queryOf(event.data.url);
        history.replaceState(null, '', location.pathname + search);
        load(search);
      }
    });

    load(location.search);
  </script>
</body>
</html>
